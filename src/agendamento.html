<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1115" />
  <title>Barbearia - Agendamento Online</title>
  <link rel="stylesheet" href="./agendamento.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="logo">💈</div>
      <h1>Barbearia</h1>
      <p>Agende seu horário em segundos</p>
    </header>

    <section class="card">
      <div class="card-title"><span class="num">1</span> Escolha o barbeiro</div>
      <div id="barbeiros" class="opcoes"></div>
      <p id="erro-barbearia" class="mensagem erro" hidden></p>
    </section>

    <section class="card">
      <div class="card-title"><span class="num">2</span> Escolha o serviço</div>
      <div id="servicos" class="opcoes"></div>
    </section>

    <section class="card">
      <div class="card-title"><span class="num">3</span> Data e horário</div>
      <input type="date" id="data" class="input" />
      <div id="horarios" class="horarios"></div>
      <p id="dica-horarios" class="dica"></p>
    </section>

    <section class="card">
      <div class="card-title"><span class="num">4</span> Seus dados</div>
      <form id="formulario" novalidate>
        <input type="text" id="nome" class="input primeiro" placeholder="Seu nome" autocomplete="name" />
        <input type="tel" id="whatsapp" class="input" placeholder="Seu WhatsApp, ex: (41) 99999-0000" autocomplete="tel" />
      </form>
    </section>

    <div id="resumo" class="card resumo" hidden></div>
    <p id="mensagem" class="mensagem" hidden></p>

    <button id="btn-confirmar" class="btn" type="button">Confirmar Agendamento</button>
  </main>

  <script type="module" src="./agendamento.js"></script>
</body>
</html>
